name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    # The CurseForge upload runs only when its token and project ID are configured
    # (secret CF_API_TOKEN, variable CF_PROJECT_ID). Wago picks the release up from GitHub
    # through a repo webhook, using the "-forever.zip" asset name.
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Builds AzerothAnte-<version>.zip (Retail) and AzerothAnte-<version>-forever.zip (Forever).
      # Both hold the same addon (the TOC lists both clients' interfaces); WowUp and Wago pick
      # the client from the name: a plain .zip is Retail, "-forever.zip" is Forever.
      - name: Build zips
        run: |
          version="${GITHUB_REF_NAME#v}"

          # The TOC version must match the tag, so the in-game version is never stale.
          toc_version=$(sed -n 's/^## Version: *\([^ ]*\).*/\1/p' AzerothAnte/AzerothAnte.toc | tr -d '\r')
          if [ "$toc_version" != "${version%%-*}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match TOC version $toc_version" >&2
            exit 1
          fi

          mkdir -p dist
          cp -r AzerothAnte dist/AzerothAnte
          cp LICENSE dist/AzerothAnte/LICENSE

          # The TOC lists Retail and Forever interfaces (120100, 120105, 120107, 16001).
          # Forever's is the five-digit one (16001 -> 1.60.1); Retail's are six digits
          # (120100 -> 12.1.0, 120105 -> 12.1.5, 120107 -> 12.1.7).
          interfaces=$(sed -n 's/^## Interface: *//p' AzerothAnte/AzerothAnte.toc | tr -d '\r' | tr ',' '\n' | tr -d ' ')
          to_patch() { printf "%d.%d.%d" $(($1 / 10000)) $(($1 / 100 % 100)) $(($1 % 100)); }
          interface=$(awk 'length($0) == 5' <<<"$interfaces" | head -1)
          if [ -z "$interface" ]; then
            echo "No Forever interface in AzerothAnte.toc" >&2
            exit 1
          fi
          patch=$(to_patch "$interface")
          retail_patches=""
          for i in $(awk 'length($0) == 6' <<<"$interfaces"); do
            retail_patches="$retail_patches $(to_patch "$i")"
          done

          # Any hyphenated tag is a pre-release, so it never ships to CurseForge as a release.
          case "$version" in
            *alpha*) stability=alpha ;;
            *-*) stability=beta ;;
            *) stability=release ;;
          esac

          zip="dist/AzerothAnte-${version}-forever.zip"
          retail_zip="dist/AzerothAnte-${version}.zip"
          (cd dist && zip -qr "../$zip" AzerothAnte && zip -qr "../$retail_zip" AzerothAnte)

          {
            echo "VERSION=$version"
            echo "ZIP=$zip"
            echo "RETAIL_ZIP=$retail_zip"
            echo "STABILITY=$stability"
            echo "PATCH=$patch"
            echo "RETAIL_PATCHES=${retail_patches# }"
            echo "NOTES_FILE=dist/notes.md"
          } >> "$GITHUB_ENV"

      # A tag with a hyphen (v0.7.0-alpha.1) is published as a pre-release.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$VERSION" in *-*) flags="--prerelease" ;; esac
          # A re-run replaces the asset on the existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ZIP" "$RETAIL_ZIP" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" "$RETAIL_ZIP" \
              --title "$GITHUB_REF_NAME" --generate-notes $flags
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$NOTES_FILE"

      - name: Upload to CurseForge
        if: env.CF_API_TOKEN != '' && env.CF_PROJECT_ID != ''
        run: .github/scripts/upload-curseforge.sh
