name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      # Core and Data unit tests, then a headless run of the real UI against the WoW API stub.
      - name: Unit tests
        run: luajit tests/run.lua

      - name: UI smoke
        run: luajit tests/smoke_ui.lua

      # A sweep of random seeds catches UI paths a single scripted run misses.
      - name: UI smoke, seeds 1-30
        run: |
          for s in $(seq 1 30); do
            if ! out=$(SMOKE_SEED=$s luajit tests/smoke_ui.lua 2>&1); then
              echo "$out"
              echo "smoke failed for seed $s"
              exit 1
            fi
          done

      - name: Syntax
        run: luajit tests/syntax.lua

      - name: Media
        run: python3 tests/test_media.py
